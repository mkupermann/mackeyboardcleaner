<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Cat performing quality assurance on a MacBook. Same monochrome line style as the app icon. -->
  <!-- FILLBG is replaced per theme (white / GitHub dark) so the cat occludes the deck lines. -->
  <g stroke="#007AFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- screen -->
    <rect x="390" y="50" width="420" height="255" rx="16"/>
    <!-- lock with countdown feel: shackle + body on screen -->
    <path d="M 562 165 A 38 38 0 0 1 638 165"/>
    <rect x="552" y="165" width="96" height="75" rx="14"/>
    <!-- keyboard deck -->
    <path d="M 370 305 L 300 430 L 900 430 L 830 305 Z"/>
    <!-- key hints, left side only (the rest is under the cat) -->
    <line x1="345" y1="345" x2="465" y2="345"/>
    <line x1="330" y1="380" x2="450" y2="380"/>
  </g>
  <!-- cat: filled silhouette parts occlude the deck behind it -->
  <g stroke="#007AFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="FILLBG">
    <!-- tail -->
    <path d="M 495 395 Q 420 415 400 355 Q 393 330 415 320" fill="none"/>
    <!-- body -->
    <ellipse cx="625" cy="390" rx="140" ry="55"/>
    <!-- front paws over the deck edge -->
    <rect x="640" y="418" width="52" height="24" rx="12"/>
    <rect x="702" y="418" width="52" height="24" rx="12"/>
    <!-- head -->
    <circle cx="770" cy="345" r="60"/>
    <!-- ears, drawn on top of the head rim -->
    <path d="M 720 318 L 716 240 L 760 292 Z"/>
    <path d="M 820 318 L 828 242 L 782 292 Z"/>
  </g>
  <g stroke="#007AFF" stroke-width="12" stroke-linecap="round" fill="none">
    <!-- irritated, half-lidded eyes -->
    <line x1="740" y1="338" x2="760" y2="338"/>
    <line x1="784" y1="338" x2="804" y2="338"/>
    <!-- whiskers -->
    <line x1="712" y1="362" x2="676" y2="356"/>
    <line x1="714" y1="374" x2="680" y2="376"/>
    <line x1="828" y1="362" x2="864" y2="356"/>
    <line x1="826" y1="374" x2="860" y2="376"/>
    <!-- mouth -->
    <path d="M 770 372 q 0 10 -10 12"/>
  </g>
  <!-- nose -->
  <path d="M 762 360 L 778 360 L 770 370 Z" fill="#007AFF"/>
  <!-- sparkles -->
  <g fill="#007AFF">
    <path d="M 255 110 L 265 140 L 295 150 L 265 160 L 255 190 L 245 160 L 215 150 L 245 140 Z"/>
    <path d="M 330 220 L 337 240 L 357 247 L 337 254 L 330 274 L 323 254 L 303 247 L 323 240 Z"/>
    <path d="M 950 160 L 958 184 L 982 192 L 958 200 L 950 224 L 942 200 L 918 192 L 942 184 Z"/>
  </g>
</svg>
